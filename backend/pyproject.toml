[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 (line-too-long) is handled by ruff format, not the linter
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# gitpython, streamlit, and requests ship no inline type stubs
module = ["git.*", "streamlit.*", "requests.*"]
ignore_missing_imports = true
